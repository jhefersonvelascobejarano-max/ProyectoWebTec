services:
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_peru_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_peru_data:/var/lib/postgresql/data
    networks:
      - red_proyecto_web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_api:
    build:
      context: ./ProyectoWebTec
      dockerfile: Dockerfile
    container_name: api_leaderboard_peru
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres_db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${API_PORT}:8080"
    networks:
      - red_proyecto_web

volumes:
  postgres_peru_data:

networks:
  red_proyecto_web:
    driver: bridge
